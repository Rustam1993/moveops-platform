  /calendar:
    get:
      operationId: GetCalendar
      summary: List scheduled jobs for a monthly calendar range
      description: >
        Returns jobs where `scheduledDate` is within `[from, to)` (inclusive `from`, exclusive `to`).
        `userId` and `departmentId` are accepted as filter placeholders but are currently ignored.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: phase
          required: false
          schema:
            type: string
            enum: [booked, scheduled, completed, cancelled]
        - in: query
          name: jobType
          required: false
          schema:
            type: string
            enum: [local, long_distance, other]
        - in: query
          name: userId
          required: false
          description: Placeholder filter; accepted but currently ignored.
          schema:
            type: string
            format: uuid
        - in: query
          name: departmentId
          required: false
          description: Placeholder filter; accepted but currently ignored.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Calendar jobs in range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
