openapi: 3.0.3
info:
  title: MoveOps API
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: GetHealth
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /auth/login:
    post:
      operationId: PostAuthLogin
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/logout:
    post:
      operationId: PostAuthLogout
      summary: Logout current session
      responses:
        '204':
          description: Logged out
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/me:
    get:
      operationId: GetAuthMe
      summary: Get current user and tenant
      responses:
        '200':
          description: Current session principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/csrf:
    get:
      operationId: GetAuthCsrf
      summary: Get csrf token for session
      responses:
        '200':
          description: CSRF token response
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
        default:
          $ref: '#/components/responses/ErrorResponse'
  /customers:
    post:
      operationId: PostCustomers
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /customers/{customerId}:
    get:
      operationId: GetCustomersCustomerId
      summary: Get customer by id
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates:
    get:
      operationId: GetEstimates
      summary: List estimates (paged)
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [draft, converted]
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Estimates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: PostEstimates
      summary: Create a draft estimate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstimateRequest'
      responses:
        '201':
          description: Draft estimate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '200':
          description: Idempotent replay returned existing estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}:
    get:
      operationId: GetEstimatesEstimateId
      summary: Get estimate by id
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estimate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: PatchEstimatesEstimateId
      summary: Update estimate fields
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEstimateRequest'
      responses:
        '200':
          description: Estimate updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/convert:
    post:
      operationId: PostEstimatesEstimateIdConvert
      summary: Convert estimate to job (idempotent)
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Job created from estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '200':
          description: Idempotent replay returned existing job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/inventory:
    get:
      operationId: GetEstimatesEstimateIdInventory
      summary: Get estimate inventory
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estimate inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateInventoryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: PutEstimatesEstimateIdInventory
      summary: Replace estimate inventory and recalculate totals
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceEstimateInventoryRequest'
      responses:
        '200':
          description: Inventory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateInventoryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/inventory-share-links:
    post:
      operationId: PostEstimatesEstimateIdInventoryShareLinks
      summary: Create customer inventory share link and send email
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryShareLinkRequest'
      responses:
        '201':
          description: Share link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInventoryShareLinkResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/charges:
    get:
      operationId: GetEstimatesEstimateIdCharges
      summary: Get estimate charges and computed totals
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estimate charges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateChargesResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: PutEstimatesEstimateIdCharges
      summary: Upsert estimate charges and recalculate totals
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceEstimateChargesRequest'
      responses:
        '200':
          description: Estimate charges updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateChargesResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/workflow:
    get:
      operationId: GetEstimatesEstimateIdWorkflow
      summary: Get estimate workflow controls for sidebar
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estimate workflow state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateWorkflowResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: PatchEstimatesEstimateIdWorkflow
      summary: Update estimate workflow controls
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEstimateWorkflowRequest'
      responses:
        '200':
          description: Workflow updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateWorkflowResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/book:
    post:
      operationId: PostEstimatesEstimateIdBook
      summary: Mark estimate as booked
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estimate booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateWorkflowResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/release-book:
    post:
      operationId: PostEstimatesEstimateIdReleaseBook
      summary: Release booked estimate back to open status
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estimate booking released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateWorkflowResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/hold:
    post:
      operationId: PostEstimatesEstimateIdHold
      summary: Move estimate to on-hold status
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldEstimateRequest'
      responses:
        '200':
          description: Estimate moved on hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateWorkflowResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/tasks:
    get:
      operationId: GetEstimatesEstimateIdTasks
      summary: List estimate tasks
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estimate tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateTaskListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: PostEstimatesEstimateIdTasks
      summary: Create estimate task
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstimateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateTaskResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/tasks/{taskId}:
    patch:
      operationId: PatchEstimatesEstimateIdTasksTaskId
      summary: Update estimate task
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEstimateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateTaskResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: DeleteEstimatesEstimateIdTasksTaskId
      summary: Delete estimate task (soft delete)
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task deleted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/payments:
    get:
      operationId: GetEstimatesEstimateIdPayments
      summary: List manual payments and payment summary
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estimate payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimatePaymentListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: PostEstimatesEstimateIdPayments
      summary: Add manual payment entry
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstimatePaymentRequest'
      responses:
        '201':
          description: Payment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimatePaymentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/payments/{paymentId}:
    delete:
      operationId: DeleteEstimatesEstimateIdPaymentsPaymentId
      summary: Delete manual payment entry (soft delete)
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Payment deleted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/documents/estimate-pdf:
    post:
      operationId: PostEstimatesEstimateIdDocumentsEstimatePdf
      summary: Generate and store estimate PDF document
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Estimate PDF generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateDocumentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      operationId: GetEstimatesEstimateIdDocumentsEstimatePdf
      summary: Get latest generated estimate PDF document
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Latest estimate PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateDocumentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/emails:
    get:
      operationId: GetEstimatesEstimateIdEmails
      summary: List estimate transactional emails
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estimate email history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateEmailLogListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/emails/send:
    post:
      operationId: PostEstimatesEstimateIdEmailsSend
      summary: Send estimate transactional email from a template
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEstimateEmailRequest'
      responses:
        '200':
          description: Email send completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEstimateEmailResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/signature-requests:
    post:
      operationId: PostEstimatesEstimateIdSignatureRequests
      summary: Create a public signature request link for estimate
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignatureRequestRequest'
      responses:
        '201':
          description: Signature request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSignatureRequestResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /estimates/{estimateId}/inventory/catalog:
    get:
      operationId: GetEstimatesEstimateIdInventoryCatalog
      summary: Get effective tenant inventory catalog for this estimate
      parameters:
        - in: path
          name: estimateId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory catalog payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimateCatalogResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/new-estimate/catalog/categories:
    get:
      operationId: GetAdminNewEstimateCatalogCategories
      summary: List tenant inventory catalog categories
      responses:
        '200':
          description: Catalog categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimateCatalogCategoryListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: PostAdminNewEstimateCatalogCategories
      summary: Create tenant inventory catalog category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNewEstimateCatalogCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimateCatalogCategoryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/new-estimate/catalog/categories/{categoryId}:
    patch:
      operationId: PatchAdminNewEstimateCatalogCategoriesCategoryId
      summary: Update tenant inventory catalog category
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNewEstimateCatalogCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimateCatalogCategoryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: DeleteAdminNewEstimateCatalogCategoriesCategoryId
      summary: Delete tenant inventory catalog category
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Category deleted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/new-estimate/catalog/items:
    get:
      operationId: GetAdminNewEstimateCatalogItems
      summary: List tenant inventory catalog items
      responses:
        '200':
          description: Catalog items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimateCatalogItemListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: PostAdminNewEstimateCatalogItems
      summary: Create tenant inventory catalog item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNewEstimateCatalogItemRequest'
      responses:
        '201':
          description: Catalog item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimateCatalogItemResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/new-estimate/catalog/items/{itemId}:
    patch:
      operationId: PatchAdminNewEstimateCatalogItemsItemId
      summary: Update tenant inventory catalog item
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNewEstimateCatalogItemRequest'
      responses:
        '200':
          description: Catalog item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimateCatalogItemResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: DeleteAdminNewEstimateCatalogItemsItemId
      summary: Delete tenant inventory catalog item
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Item deleted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/new-estimate/catalog/import:
    post:
      operationId: PostAdminNewEstimateCatalogImport
      summary: Import tenant inventory catalog from CSV
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Catalog import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimateCatalogImportResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/new-estimate/catalog/export:
    get:
      operationId: GetAdminNewEstimateCatalogExport
      summary: Export tenant inventory catalog CSV
      responses:
        '200':
          description: CSV file bytes
          content:
            text/csv:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/new-estimate/pricing:
    get:
      operationId: GetAdminNewEstimatePricing
      summary: Get tenant pricing defaults for New Estimate
      responses:
        '200':
          description: Pricing defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimatePricingDefaultsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: PutAdminNewEstimatePricing
      summary: Update tenant pricing defaults for New Estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEstimatePricingDefaults'
      responses:
        '200':
          description: Pricing defaults updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimatePricingDefaultsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/new-estimate/email-templates:
    get:
      operationId: GetAdminNewEstimateEmailTemplates
      summary: Get tenant transactional email templates for New Estimate
      responses:
        '200':
          description: Email templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEstimateEmailTemplatesResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: PutAdminNewEstimateEmailTemplates
      summary: Update tenant transactional email templates for New Estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEstimateEmailTemplates'
      responses:
        '200':
          description: Email templates updated
          content:
            application/json:
              schema:
