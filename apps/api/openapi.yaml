components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    ErrorResponse:
      description: Standard API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthSessionResponse:
      type: object
      required: [user, tenant]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant:
          $ref: '#/components/schemas/Tenant'
    Tenant:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    User:
      type: object
      required: [id, email, fullName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
    CreateCustomerRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
    Customer:
      type: object
      required: [id, tenantId, firstName, lastName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateEstimateRequest:
      type: object
      required:
        - customerName
        - primaryPhone
        - email
        - originAddressLine1
        - originCity
        - originState
        - originPostalCode
        - destinationAddressLine1
        - destinationCity
        - destinationState
        - destinationPostalCode
        - moveDate
        - leadSource
      properties:
        customerName:
          type: string
          minLength: 1
        primaryPhone:
          type: string
          minLength: 1
        secondaryPhone:
          type: string
        email:
          type: string
          format: email
        originAddressLine1:
          type: string
          minLength: 1
        originCity:
          type: string
          minLength: 1
        originState:
          type: string
          minLength: 1
        originPostalCode:
          type: string
          minLength: 1
        destinationAddressLine1:
          type: string
          minLength: 1
        destinationCity:
          type: string
          minLength: 1
        destinationState:
          type: string
          minLength: 1
        destinationPostalCode:
          type: string
          minLength: 1
        moveDate:
          type: string
          format: date
        pickupTime:
          type: string
        leadSource:
          type: string
          minLength: 1
        moveSize:
          type: string
        locationType:
          type: string
        estimatedTotalCents:
          type: integer
          format: int64
          minimum: 0
        depositCents:
          type: integer
          format: int64
          minimum: 0
        notes:
          type: string
    UpdateEstimateRequest:
      type: object
      properties:
        customerName:
          type: string
          minLength: 1
        primaryPhone:
          type: string
          minLength: 1
        secondaryPhone:
          type: string
        email:
          type: string
          format: email
        originAddressLine1:
          type: string
          minLength: 1
        originCity:
          type: string
          minLength: 1
        originState:
          type: string
          minLength: 1
        originPostalCode:
          type: string
          minLength: 1
        destinationAddressLine1:
          type: string
          minLength: 1
        destinationCity:
          type: string
          minLength: 1
        destinationState:
          type: string
          minLength: 1
        destinationPostalCode:
          type: string
          minLength: 1
        moveDate:
          type: string
          format: date
        pickupTime:
          type: string
        leadSource:
          type: string
          minLength: 1
        moveSize:
          type: string
        locationType:
          type: string
        estimatedTotalCents:
          type: integer
          format: int64
          minimum: 0
        depositCents:
          type: integer
          format: int64
          minimum: 0
        notes:
          type: string
    Estimate:
      type: object
      required:
        - id
        - tenantId
        - estimateNumber
        - customerId
        - customerName
        - primaryPhone
        - email
        - status
        - originAddressLine1
        - originCity
        - originState
        - originPostalCode
        - destinationAddressLine1
        - destinationCity
        - destinationState
        - destinationPostalCode
        - moveDate
        - leadSource
        - totalVolumeCf
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        estimateNumber:
          type: string
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        primaryPhone:
          type: string
        secondaryPhone:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [draft, converted]
        originAddressLine1:
          type: string
        originCity:
          type: string
        originState:
          type: string
        originPostalCode:
          type: string
        destinationAddressLine1:
          type: string
        destinationCity:
          type: string
        destinationState:
          type: string
        destinationPostalCode:
          type: string
        moveDate:
          type: string
          format: date
        pickupTime:
          type: string
        leadSource:
          type: string
        moveSize:
          type: string
        locationType:
          type: string
        totalVolumeCf:
          type: number
          format: double
          minimum: 0
        estimatedTotalCents:
          type: integer
          format: int64
        depositCents:
          type: integer
          format: int64
        notes:
          type: string
        convertedJobId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EstimateResponse:
      type: object
      required: [estimate, requestId]
      properties:
        estimate:
          $ref: '#/components/schemas/Estimate'
        requestId:
          type: string
    EstimateInventoryItem:
      type: object
      required: [category, itemName, volumeCf, qty]
      properties:
        category:
          type: string
          minLength: 1
        itemName:
          type: string
          minLength: 1
        volumeCf:
          type: number
          format: double
          minimum: 0
        qty:
          type: integer
          minimum: 0
        isCustom:
          type: boolean
    ReplaceEstimateInventoryRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/EstimateInventoryItem'
    EstimateInventoryResponse:
